name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5.1
      - run: unzip LangOpener.zip
      - run: cd LangOpener && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LangOpener-APK
          path: LangOpener/app/build/outputs/apk/debug/app-debug.apk
